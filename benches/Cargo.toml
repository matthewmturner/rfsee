[package]
name = "benches"
version = "0.1.0"
edition = "2021"

[features]
linux-perf = ["dep:perf-event"]

[dependencies]
perf-event = { version = "0.4", optional = true }
rand = { version = "0.8", features = ["small_rng"] }
rfsee-tf-idf = { path = "../crates/tf_idf" }
simd-json = "0.14.3"

[dev-dependencies]
criterion = "0.5.1"

# Only the criterion targets below should run under `cargo bench`; lib/bins
# default to bench = true, which makes libtest reject criterion flags such as
# --save-baseline.
[lib]
bench = false

[[bin]]
name = "benches"
path = "src/main.rs"
bench = false

[[bin]]
name = "perf"
path = "src/bin/perf.rs"
bench = false
required-features = ["linux-perf"]

[[bin]]
name = "generate_data"
path = "src/bin/generate_data.rs"
bench = false

[[bench]]
name = "add_rfc_entry"
harness = false

[[bench]]
name = "combine_scores"
harness = false

[[bench]]
name = "index_pipeline"
harness = false

[[bench]]
name = "index_serde"
harness = false

[[bench]]
name = "search_index"
harness = false
